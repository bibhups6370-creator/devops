services:
  postgres:
    image: postgres:16
    container_name: learncloud-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: learncloud_dev

    ports:
      - "5432:5432"

    volumes:
      - learncloud_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learncloud_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  learncloud_postgres_data:
